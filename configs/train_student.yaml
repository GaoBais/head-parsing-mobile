train:
  seed: 42
  epochs: 160
  batch_size: 64
  num_workers: 8
  precision: amp
  optimizer:
    name: sgd
    lr: 0.02
    momentum: 0.9
    weight_decay: 0.00004
  scheduler:
    name: poly
    power: 0.9
    warmup_epochs: 3
  losses:
    ce_weight: 1.0
    dice_weight: 0.5
    boundary_weight: 0.2
    distill_weight: 0.5
    ohem: true
  augmentation:
    random_scale: [0.5, 2.0]
    random_rotate_deg: 30
    random_translate_ratio: 0.25
    random_letterbox: true
    color_jitter: true
    blur: true
    jpeg: true
    occlusion: true
  teacher:
    enabled: true
    model: bisenet_resnet34
    repo_path: ../face-parsing
    checkpoint: weights/teacher_resnet34.pt
    temperature: 2.0
